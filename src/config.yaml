site:
  name: ECRS
  site: 'https://ecrs.org'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: ECRS — Come to Play. Play to Learn.
    template: '%s — ECRS'
  description: 'An intergenerational organization providing creative and engaging activities that are fun, develop leadership and build community.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: ECRS
    images:
      - url: '/og/default.jpg'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: '@yay4ecrs'
    site: '@yay4ecrs'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

analytics:
  vendors:
    googleAnalytics:
      id: 'G-TMYSFB9B9J' # GA4 — gated by geo-targeted consent banner (everywhere except US)
    cloudflareWebAnalytics:
      # Cloudflare Web Analytics (RUM): page views + Core Web Vitals, cookieless.
      # Retired 2026-08-20 — Cloudflare auto-injects a zone-wide beacon for ecrs.org
      # now that the domain is proxied through Pages, covering ecrs.org and www.ecrs.org
      # at the edge. Keeping this one too would double-count every real pageview.
      token: ''
    metaPixel:
      # Meta Pixel — fill in the Pixel ID from Meta Business Suite > Events Manager.
      # Leave blank to disable. Consent-gated in CA/EU/UK (same banner as GA4).
      id: '2181667296115815'

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
