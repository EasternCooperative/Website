name: Rendered PDFs

# Renders built pages to static PDFs with headless Chrome and commits any
# changes back to main: each /events/<id>/schedule page to
# public/schedules/<id>.pdf, and Of Play and Playfulness to
# public/docs/of-play-and-playfulness.pdf. Cloudflare Pages then serves the
# PDFs as plain static files — no headless browser in the Pages build.

on:
  push:
    branches: [main]
    paths:
      - 'src/data/events/**'
      - 'src/data/leaders/**'
      - 'src/pages/events/[id]/schedule.astro'
      - 'src/components/schedule/scheduleGrid.ts'
      - 'src/utils/eventSchedule.ts'
      - 'scripts/render-schedule-pdfs.mjs'
      - 'src/data/of-play-and-playfulness/**'
      - 'src/data/settings/of-play-and-playfulness.json'
      - 'src/pages/of-play-and-playfulness/print.astro'
      - 'src/assets/styles/of-play-and-playfulness.css'
      - 'src/utils/ofPlayAndPlayfulness.ts'
      - 'public/images/of-play-and-playfulness/**'
      - 'scripts/render-book-pdf.mjs'
      - 'scripts/lib/serve-dist.mjs'
      - '.github/workflows/schedule-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedule-pdfs
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # render-book-pdf.mjs dates the PDF by the book's last commit.
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install chromium --with-deps
      - run: node scripts/render-schedule-pdfs.mjs
      - run: node scripts/render-book-pdf.mjs
      - name: Commit updated PDFs
        env:
          # npm ci installs the lefthook git hooks; the pre-push hook re-runs
          # the whole check and test suite, which only widens the race below.
          LEFTHOOK: '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/schedules public/docs/of-play-and-playfulness.pdf
          if git diff --staged --quiet; then
            echo "No PDF changes."
            exit 0
          fi
          git commit -m "chore(pdf): regenerate rendered PDFs"
          # Main can move while the render runs (another PR merges). Only this
          # job writes these PDFs, so rebasing onto the new main is safe; if
          # that new commit changed a PDF source, its own run supersedes this
          # one through the concurrency group.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done
          exit 1
