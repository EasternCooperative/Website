name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detects whether a change touches anything beyond CMS-managed content.
  # Content-only commits (the common case — every Sveltia edit) run just the
  # fast validators (check + build); code changes also run the full test,
  # e2e, and Lighthouse jobs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      content-only: ${{ steps.filter.outputs.content-only }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # content-only is true only when EVERY changed file matches
          predicate-quantifier: 'every'
          filters: |
            content-only:
              - 'src/data/**'
              - 'public/images/**'

  # Always runs: astro check + eslint + prettier.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # Always runs: the build is the only check that validates content against
  # the zod schemas in src/content.config.ts, so it must run for CMS commits.
  # Gated on `check` so a broken lint/format/type-check fails fast without
  # spending a full astro build on doomed code.
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed - no dist directory"
            exit 1
          fi

  test:
    needs: [changes, check]
    if: needs.changes.outputs.content-only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  e2e:
    # Gated on `build` (not just `check`) since this job rebuilds the site
    # itself (playwright.config.ts's webServer runs `npm run build && npm
    # run preview`) — no point installing browsers for a build we already
    # know is broken.
    needs: [changes, build]
    if: needs.changes.outputs.content-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          CI: true

  lighthouse:
    # Gated on `build` since `npm run lighthouse` (`npm run build && lhci
    # autorun`) rebuilds the site itself — avoid a duplicate wasted build.
    needs: [changes, build]
    if: needs.changes.outputs.content-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds the site, serves it via `astro preview` (startServerCommand in
      # .lighthouserc.json), and asserts a11y/best-practices/SEO >= 0.9.
      - run: npm run lighthouse

  # Sveltia CMS commits directly to main with no PR, so a broken CMS edit
  # (e.g. content that fails the zod schema in src/content.config.ts) has no
  # reviewer to surface a failing check to. Open an issue so it doesn't sit
  # unnoticed — Cloudflare Pages keeps serving the last good deploy, but the
  # new content won't go live until this is fixed.
  notify-on-failure:
    needs: [changes, check, build, test, e2e, lighthouse]
    if: always() && github.event_name == 'push' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI failed on main: ${context.sha.slice(0, 7)}`,
              body: [
                'A push to `main` failed CI — likely a CMS edit that broke `astro build`\'s content validation.',
                '',
                `Commit: ${context.sha}`,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Cloudflare Pages keeps serving the last successful deploy, so the live site is unaffected for now — but this content will not go live until the underlying issue is fixed.',
              ].join('\n'),
            });
