name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Catches new CodeQL query-pack findings on unchanged code.
    - cron: '0 6 * * 3'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans the workflow YAML itself (permissions, injection,
        # untrusted checkouts). Default setup covered it until we moved to
        # this workflow; without it the old /language:actions results go
        # stale and GitHub flags code scanning as out of date.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4.39.3
        with:
          category: '/language:${{ matrix.language }}'
