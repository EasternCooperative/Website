# -------------------------------------------------------
# Sveltia CMS Configuration for ECRS
# Backend: GitHub OAuth via Sveltia CMS Auth Worker (Cloudflare)
# Hosting: Cloudflare Pages
#
# Note: Sveltia commits directly to `main` — it does not support
# Decap's editorial_workflow, and nothing here should assume
# PR-based content review. See docs/deployment-and-cms.md.
# -------------------------------------------------------

backend:
  name: github
  repo: EasternCooperative/Website
  branch: main
  auth_scope: public_repo
  base_url: https://sveltia-cms-auth.isaac-cd9.workers.dev

local_backend: true

media_folder: 'public/images'
public_folder: '/images'

# -------------------------------------------------------
# Collections
# -------------------------------------------------------
collections:
  # --- PAGES (files collection — one entry per singleton page) ---
  - name: 'pages'
    label: 'Pages'
    files:
      - name: 'landing'
        label: 'Home'
        file: 'src/data/settings/landing.md'
        fields:
          - { label: 'Hero Headline', name: 'heroTitle', widget: 'string' }
          - { label: 'Hero Subtitle', name: 'heroSubtitle', widget: 'markdown' }
          - { label: '"Who We Are" Heading', name: 'aboutTitle', widget: 'string' }
          - { label: '"Who We Are" Body', name: 'aboutBody', widget: 'markdown' }
          - { label: '"Who We Are" Image', name: 'aboutImage', widget: 'image', required: false }
          - label: '"What to Expect" Section'
            name: 'whatToExpectTitle'
            widget: 'string'
          - { label: '"What to Expect" Subtitle', name: 'whatToExpectSubtitle', widget: 'markdown' }
          - label: '"What to Expect" Items'
            name: 'whatToExpectItems'
            widget: 'list'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Description', name: 'description', widget: 'markdown' }
              - { label: 'Icon (tabler)', name: 'icon', widget: 'string', hint: 'e.g. tabler:palette' }
          - { label: '"Why ECRS?" Heading', name: 'whyTitle', widget: 'string' }
          - { label: '"Why ECRS?" Subtitle', name: 'whySubtitle', widget: 'markdown' }
          - label: 'Value Pillars ("Why ECRS?" items)'
            name: 'pillars'
            widget: 'list'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Description', name: 'description', widget: 'markdown' }
              - { label: 'Icon (tabler)', name: 'icon', widget: 'string', hint: 'e.g. tabler:music' }
          - { label: '"More Events" Eyebrow', name: 'moreEventsEyebrow', widget: 'string' }
          - { label: '"More Events" Heading', name: 'moreEventsHeading', widget: 'string' }
          - { label: '"More Events" View All Button', name: 'moreEventsViewAllText', widget: 'string' }
          - { label: 'CTA Heading', name: 'ctaTitle', widget: 'string' }
          - { label: 'CTA Subtitle', name: 'ctaSubtitle', widget: 'markdown' }
          - { label: 'CTA Primary Button Text', name: 'ctaPrimaryText', widget: 'string' }
          - { label: 'CTA Primary Button URL', name: 'ctaPrimaryHref', widget: 'string' }
          - { label: 'CTA Secondary Button Text', name: 'ctaSecondaryText', widget: 'string' }
          - { label: 'CTA Secondary Button URL', name: 'ctaSecondaryHref', widget: 'string' }

      - name: 'about'
        label: 'About'
        file: 'src/data/settings/about.json'
        fields:
          - { label: 'Hero Tagline', name: 'heroTagline', widget: 'string' }
          - { label: 'Hero Title', name: 'heroTitle', widget: 'string' }
          - { label: 'Intro Text', name: 'introText', widget: 'markdown' }
          - { label: 'Intro Image', name: 'introImage', widget: 'image' }
          - { label: 'Intro Image Alt Text', name: 'introImageAlt', widget: 'string' }
          - label: 'Pillars'
            name: 'pillars'
            widget: 'list'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Description', name: 'description', widget: 'markdown' }
              - { label: 'Icon (tabler)', name: 'icon', widget: 'string', hint: 'e.g. tabler:heart' }
          - { label: 'CTA Title', name: 'ctaTitle', widget: 'string' }
          - { label: 'CTA Subtitle', name: 'ctaSubtitle', widget: 'markdown' }
          - { label: 'CTA Primary Button Text', name: 'ctaPrimaryText', widget: 'string' }
          - { label: 'CTA Primary Button URL', name: 'ctaPrimaryHref', widget: 'string' }
          - { label: 'CTA Secondary Button Text', name: 'ctaSecondaryText', widget: 'string' }
          - { label: 'CTA Secondary Button URL', name: 'ctaSecondaryHref', widget: 'string' }

      - name: 'events-list'
        label: 'Events'
        file: 'src/data/settings/events-list.json'
        fields:
          - { label: 'Hero Tagline', name: 'heroTagline', widget: 'string' }
          - { label: 'Hero Title', name: 'heroTitle', widget: 'string' }
          - { label: 'Hero Subtitle', name: 'heroSubtitle', widget: 'markdown' }
          - { label: 'Upcoming Events Heading', name: 'upcomingHeading', widget: 'string' }
          - { label: 'Past Events Heading', name: 'pastHeading', widget: 'string' }
          - { label: 'No Upcoming Events Message', name: 'emptyStateText', widget: 'string' }

      - name: 'activities-list'
        label: 'Activities'
        file: 'src/data/settings/activities-list.json'
        fields:
          - { label: 'Hero Tagline', name: 'heroTagline', widget: 'string' }
          - { label: 'Hero Title', name: 'heroTitle', widget: 'string' }
          - { label: 'Hero Subtitle', name: 'heroSubtitle', widget: 'markdown' }
          - { label: 'No Activities Message', name: 'emptyStateText', widget: 'string' }
          - {
              label: 'Card Style',
              name: 'cardStyle',
              widget: 'select',
              options: ['rich', 'lean'],
              hint: 'Rich shows images/excerpts on cards — fine for a small library. Switch to Lean if the catalog grows into the hundreds, to keep the list page light.',
            }

      - name: 'contact'
        label: 'Contact'
        file: 'src/data/settings/contact.json'
        fields:
          - { label: 'Hero Tagline', name: 'heroTagline', widget: 'string' }
          - { label: 'Hero Title', name: 'heroTitle', widget: 'string' }
          - { label: 'Intro Text', name: 'introText', widget: 'markdown' }
          - {
              label: 'Cognito Form ID',
              name: 'cognitoFormId',
              widget: 'string',
              hint: 'Number from the Cognito Forms embed URL',
            }

      - name: 'donation'
        label: 'Donate'
        file: 'src/data/settings/donation.json'
        fields:
          - { label: 'Hero Tagline', name: 'heroTagline', widget: 'string' }
          - { label: 'Hero Title', name: 'heroTitle', widget: 'string' }
          - {
              label: 'SEO Description',
              name: 'metaDescription',
              widget: 'text',
              hint: 'Shown in search engine results — plain text only, no markdown (search engines display it literally).',
            }
          - { label: 'Intro Text', name: 'introText', widget: 'markdown' }
          - {
              label: 'Cognito Form ID',
              name: 'cognitoFormId',
              widget: 'string',
              hint: 'The number at the end of the Cognito Forms embed URL (e.g. 17)',
            }

      - name: 'membership'
        label: 'Membership'
        file: 'src/data/settings/membership.json'
        fields:
          - { label: 'Hero Tagline', name: 'heroTagline', widget: 'string' }
          - { label: 'Hero Title', name: 'heroTitle', widget: 'string' }
          - { label: 'Benefits Section Title', name: 'benefitsTitle', widget: 'string' }
          - label: 'Benefits'
            name: 'benefits'
            widget: 'list'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Description', name: 'description', widget: 'markdown' }
              - { label: 'Icon (tabler)', name: 'icon', widget: 'string', hint: 'e.g. tabler:ticket' }
          - { label: 'Pricing Section Title', name: 'pricingTitle', widget: 'string' }
          - { label: 'Pricing Intro Text', name: 'pricingIntro', widget: 'markdown' }
          - label: 'Pricing Tiers'
            name: 'pricingTiers'
            widget: 'list'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Subtitle', name: 'subtitle', widget: 'string' }
              - { label: 'Price', name: 'price', widget: 'string', hint: 'e.g. $25' }
              - { label: 'Featured (highlighted)', name: 'featured', widget: 'boolean', default: false }
          - { label: 'Form Section Heading', name: 'formHeading', widget: 'string' }
          - { label: 'Form Note', name: 'formNote', widget: 'markdown' }
          - { label: 'Form Note Email', name: 'formNoteEmail', widget: 'string' }
          - {
              label: 'Cognito Form ID',
              name: 'cognitoFormId',
              widget: 'string',
              hint: 'Number from the Cognito Forms embed URL',
            }

      - name: 'people'
        label: 'Our People'
        file: 'src/data/pages/people.json'
        fields:
          - { label: 'Page Title', name: 'title', widget: 'string', default: 'Our People' }
          - label: 'Sections'
            name: 'categories'
            widget: 'list'
            hint: 'Add sections like "Board of Directors", "Volunteers", etc. Leaders are shown automatically above these.'
            fields:
              - { label: 'Section Title', name: 'label', widget: 'string' }
              - label: 'People'
                name: 'people'
                widget: 'list'
                fields:
                  - { label: 'Name', name: 'name', widget: 'string' }
                  - { label: 'Title / Role', name: 'title', widget: 'string', required: false }
                  - { label: 'Photo', name: 'photo', widget: 'image', required: false }
                  - { label: 'Bio', name: 'bio', widget: 'markdown', required: false }

      - name: 'not-found'
        label: '404 Page'
        file: 'src/data/settings/not-found.json'
        fields:
          - { label: 'Heading', name: 'title', widget: 'string' }
          - { label: 'Subtitle', name: 'subtitle', widget: 'string' }
          - { label: 'Back to Homepage Link Text', name: 'backLinkText', widget: 'string' }

  # --- LEADERS (folder collection — one file per person) ---
  - name: 'leader'
    label: 'Leaders & Instructors'
    label_singular: 'Leader'
    folder: 'src/data/leaders'
    create: true
    identifier_field: name
    slug: '{{fields.name | slugify}}'
    fields:
      - { label: 'Name', name: 'name', widget: 'string' }
      - {
          label: 'Title / Specialty',
          name: 'title',
          widget: 'string',
          required: false,
          hint: 'e.g. Folk Dance Instructor, Musician',
        }
      - { label: 'Photo', name: 'photo', widget: 'image', required: false }
      - { label: 'Bio', name: 'bio', widget: 'markdown', required: false }
      - {
          label: 'Co-Leader (from Leader Records)',
          name: 'partnerId',
          widget: 'relation',
          collection: 'leader',
          search_fields: ['name'],
          value_field: '{{slug}}',
          display_fields: ['name'],
          required: false,
          hint: 'Only for a person who always co-leads with one specific other leader and shares their bio/photo (e.g. a couple who only ever teach together). Set this on both leader records, pointing at each other — they will then show as a single combined card on the Our People page instead of two duplicates.',
        }

  # --- VENUES (folder collection — one file per venue) ---
  - name: 'site'
    label: 'Venues'
    label_singular: 'Venue'
    folder: 'src/data/sites'
    create: true
    identifier_field: name
    slug: '{{fields.name | slugify}}'
    fields:
      - { label: 'Name', name: 'name', widget: 'string' }
      - { label: 'Full Address', name: 'address', widget: 'string', required: false }
      - { label: 'Phone', name: 'phone', widget: 'string', required: false }
      - {
          label: 'Accessibility Note',
          name: 'accessibilityNote',
          widget: 'string',
          required: false,
          hint: 'e.g. Venue is wheelchair accessible',
        }
      - {
          label: 'Venue Image',
          name: 'image',
          widget: 'image',
          required: false,
          hint: 'Default image shown on all events at this venue.',
        }

  # --- EVENTS (folder collection — one file per event) ---
  - name: 'event'
    label: 'Events'
    label_singular: 'Event'
    folder: 'src/data/events'
    create: true
    slug: '{{year}}-{{fields.title}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Event Date', name: 'date', widget: 'datetime', date_format: 'YYYY-MM-DD', time_format: false }
      - {
          label: 'End Date',
          name: 'endDate',
          widget: 'datetime',
          date_format: 'YYYY-MM-DD',
          time_format: false,
          required: false,
        }
      - { label: 'Start Time', name: 'startTime', widget: 'string', required: false, hint: 'e.g. 5:00 PM' }
      - { label: 'End Time', name: 'endTime', widget: 'string', required: false, hint: 'e.g. 3:00 PM' }
      - {
          label: 'Venue',
          name: 'siteId',
          widget: 'relation',
          collection: 'site',
          search_fields: ['name'],
          value_field: '{{slug}}',
          display_fields: ['name'],
          required: false,
          hint: 'Select a venue — location name, address, and image will be pulled automatically.',
        }
      - {
          label: 'Location Name Override',
          name: 'location',
          widget: 'string',
          required: false,
          hint: 'Leave blank when a venue is selected above. Fill this only for one-off locations.',
        }
      - {
          label: 'Address Override',
          name: 'address',
          widget: 'string',
          required: false,
          hint: 'Leave blank to use the venue address.',
        }
      - { label: 'Short Description (excerpt)', name: 'excerpt', widget: 'string', required: false }
      - { label: 'Full Description', name: 'description', widget: 'markdown', required: false }
      - {
          label: 'Event Image Override',
          name: 'image',
          widget: 'image',
          required: false,
          hint: 'Optional — overrides the venue image for this specific event.',
        }
      - {
          label: 'Phone Override',
          name: 'phone',
          widget: 'string',
          required: false,
          hint: 'Overrides venue phone number',
        }
      - {
          label: 'Accessibility Note Override',
          name: 'accessibilityNote',
          widget: 'string',
          required: false,
          hint: 'Overrides the venue accessibility note for this event.',
        }

      # ── Registration ──────────────────────────────────────────────
      - { label: 'Registration URL', name: 'registrationUrl', widget: 'string', required: false }
      - {
          label: 'Registration Deadline',
          name: 'registrationDeadline',
          widget: 'datetime',
          date_format: 'YYYY-MM-DD',
          time_format: false,
          required: false,
        }
      - {
          label: 'Early-Bird Deadline',
          name: 'earlyBirdDeadline',
          widget: 'datetime',
          date_format: 'YYYY-MM-DD',
          time_format: false,
          required: false,
        }
      - {
          label: 'Early-Bird Fee Note',
          name: 'earlyBirdFeeNote',
          widget: 'string',
          required: false,
          hint: 'e.g. $50/adult, $25/child late fee applies after this date',
        }
      - {
          label: 'Cognito Form ID',
          name: 'cognitoFormId',
          widget: 'string',
          required: false,
          hint: 'Number at the end of the Cognito Forms embed URL (e.g. 17)',
        }

      # ── Pricing ───────────────────────────────────────────────────
      - {
          label: 'Simple Fee',
          name: 'fee',
          widget: 'string',
          required: false,
          hint: 'For day events with a single price, e.g. "Free / $25 adults". Leave blank for multi-tier pricing below.',
        }
      - {
          label: 'Tuition Section Heading',
          name: 'tuitionLabel',
          widget: 'string',
          required: false,
          hint: 'Defaults to "Tuition" if left blank',
        }
      - label: 'Tuition'
        name: 'tuition'
        widget: 'list'
        required: false
        hint: 'Tuition rows (separate from room & board)'
        fields:
          - { label: 'Label', name: 'label', widget: 'string', required: false, hint: 'e.g. Ages 18+' }
          - { label: 'Amount', name: 'amount', widget: 'string', hint: 'e.g. $110' }
          - { label: 'Note', name: 'note', widget: 'string', required: false }
      - label: 'Accommodations'
        name: 'accommodations'
        widget: 'list'
        required: false
        hint: 'Room & board options for residential events'
        fields:
          - { label: 'Name', name: 'name', widget: 'string', hint: 'e.g. Main Lodge' }
          - {
              label: 'Description',
              name: 'description',
              widget: 'markdown',
              required: false,
              hint: 'e.g. Dorm-style, shared bath, bring linens',
            }
          - label: 'Pricing Tiers'
            name: 'tiers'
            widget: 'list'
            fields:
              - { label: 'Label', name: 'label', widget: 'string', hint: 'e.g. Adults, 2/room' }
              - { label: 'Amount', name: 'amount', widget: 'string', hint: 'e.g. $430' }

      # ── Logistics ─────────────────────────────────────────────────
      - {
          label: 'Meals Included',
          name: 'mealsIncluded',
          widget: 'string',
          required: false,
          hint: 'e.g. Dinner Dec 27 through breakfast Jan 1',
        }
      - {
          label: 'Meals Note',
          name: 'mealsNote',
          widget: 'markdown',
          required: false,
          hint: 'Dietary accommodations, beverage info, etc.',
        }

      # ── Policies ──────────────────────────────────────────────────
      - {
          label: 'Show Cancellation Policy',
          name: 'showCancellationPolicy',
          widget: 'boolean',
          required: false,
          default: false,
        }
      - {
          label: 'Cancellation Cutoff Date',
          name: 'cancellationCutoffDate',
          widget: 'datetime',
          date_format: 'YYYY-MM-DD',
          time_format: false,
          required: false,
          hint: 'Refunds available before this date. Typically the 1st of the event start month.',
        }
      - label: 'Cancellation Policy'
        name: 'cancellationPolicy'
        widget: 'markdown'
        required: false
        default: 'Before the cutoff date shown below, Room & Board fees are refundable; tuition is non-refundable. After that date, no refunds can be issued, as we have already made financial commitments to the facility. If you must cancel due to a communicable illness, please contact us immediately — you will receive a 50% refund of your total registration.'
      - { label: 'Show Health Policy', name: 'showHealthPolicy', widget: 'boolean', required: false, default: false }
      - label: 'Health Policy'
        name: 'healthPolicy'
        widget: 'markdown'
        required: false
        default: 'In the week before the event, please mask when in crowded indoor spaces and monitor your health. If you are sick, we ask that you not come.'

      # ── Classes / Program ─────────────────────────────────────────
      - label: 'Classes'
        name: 'classes'
        widget: 'list'
        required: false
        hint: 'Classes are grouped by period in the order they are entered.'
        fields:
          - { label: 'Class Name', name: 'name', widget: 'string' }
          - {
              label: 'Leader (from Leader Records)',
              name: 'leaderId',
              widget: 'relation',
              collection: 'leader',
              search_fields: ['name'],
              value_field: '{{slug}}',
              display_fields: ['name'],
              required: false,
              hint: 'Link to a leader record for photo and bio. If no record exists yet, use the free-text field below.',
            }
          - {
              label: 'Leader (free text)',
              name: 'leader',
              widget: 'string',
              required: false,
              hint: 'Used when no leader record is linked.',
            }
          - { label: 'Age Range', name: 'ageRange', widget: 'string', required: false, hint: 'e.g. 12+, All ages' }
          - {
              label: 'Period',
              name: 'period',
              widget: 'string',
              required: false,
              hint: 'Used as a section heading, e.g. "Morning – First Period". Leave blank for a flat list.',
            }
          - {
              label: 'Days',
              name: 'days',
              widget: 'string',
              required: false,
              hint: 'Multi-day events only, e.g. "Days 1–2" or "All 4 days".',
            }
          - { label: 'Limited Capacity', name: 'limitedCapacity', widget: 'boolean', required: false, default: false }
          - { label: 'Description', name: 'description', widget: 'markdown', required: false }
          - {
              label: 'Callout',
              name: 'callout',
              widget: 'string',
              required: false,
              hint: 'Emphasized note shown below the description, e.g. "Open to children 8+ with a participating adult."',
            }

      # ── Additional Info ───────────────────────────────────────────
      - {
          label: 'Newcomer Note',
          name: 'newcomerNote',
          widget: 'markdown',
          required: false,
          hint: 'e.g. Newcomers receive free tuition',
        }
      - { label: 'Financial Aid Note', name: 'financialAidNote', widget: 'markdown', required: false }

      - label: 'Tags'
        name: 'tags'
        widget: 'list'
        required: false
        field: { label: 'Tag', name: 'tag', widget: 'string' }

  # --- ACTIVITIES (four collections over one folder, split by `type`) ---
  # Each collection filters src/data/activities by the hidden `type` field so
  # the editor form only shows fields relevant to that activity type. Shared
  # field definitions are declared once as YAML anchors (&act-*) on the Games
  # collection and aliased (*act-*) in the others.
  - name: 'activity-game'
    label: 'Games'
    label_singular: 'Game'
    folder: 'src/data/activities'
    create: true
    slug: '{{fields.title | slugify}}'
    filter: { field: 'type', value: 'game' }
    fields:
      - &act-title { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Type', name: 'type', widget: 'hidden', default: 'game' }
      - &act-excerpt {
          label: 'Short Description (excerpt)',
          name: 'excerpt',
          widget: 'string',
          required: false,
          hint: 'Shown on the activity card and used as the page description.',
        }
      - &act-instructions {
          label: 'Instructions',
          name: 'instructions',
          widget: 'markdown',
          required: false,
          hint: 'Step-by-step instructions, in your own words. Do not paste copyrighted lyrics or sheet music — link out instead using References below.',
        }
      - &act-leading-tips {
          label: 'Leading Tips',
          name: 'leadingTips',
          widget: 'markdown',
          required: false,
          hint: 'Advice for someone leading this activity for the first time.',
        }
      - &act-adaptations {
          label: 'Adaptations',
          name: 'adaptations',
          widget: 'markdown',
          required: false,
          hint: 'How to simplify or extend this for different skill levels.',
        }
      - &act-group-size-min { label: 'Minimum Group Size', name: 'groupSizeMin', widget: 'number', required: false }
      - &act-group-size-max { label: 'Maximum Group Size', name: 'groupSizeMax', widget: 'number', required: false }
      - &act-group-size-notes {
          label: 'Group Size Adaptations',
          name: 'groupSizeAdaptationNotes',
          widget: 'markdown',
          required: false,
          hint: 'How to adapt this for an especially large or small group.',
        }
      - &act-duration {
          label: 'Duration',
          name: 'duration',
          widget: 'string',
          required: false,
          hint: 'e.g. "5-10 minutes"',
        }
      - &act-energy-level {
          label: 'Energy Level',
          name: 'energyLevel',
          widget: 'select',
          options: ['low', 'medium', 'high'],
          required: false,
          hint: 'Overall vibe/intensity of leading this.',
        }
      - &act-origin {
          label: 'Origin / Attribution',
          name: 'origin',
          widget: 'string',
          required: false,
          hint: 'e.g. "Traditional", "Choreographed by Jane Doe", "As taught by John Smith"',
        }
      - &act-references
        label: 'References'
        name: 'references'
        widget: 'list'
        required: false
        hint: 'Links to recordings, tutorial videos, or official sources — do not host copyrighted audio/lyrics directly.'
        fields:
          - { label: 'URL', name: 'url', widget: 'string' }
          - {
              label: 'Label',
              name: 'label',
              widget: 'string',
              required: false,
              hint: 'e.g. "Listen on YouTube", "Tutorial video"',
            }
      - &act-related-leaders {
          label: 'Related Leaders',
          name: 'relatedLeaderIds',
          widget: 'relation',
          collection: 'leader',
          search_fields: ['name'],
          value_field: '{{slug}}',
          display_fields: ['name'],
          multiple: true,
          required: false,
        }
      - &act-related-events {
          label: 'Related Events',
          name: 'relatedEventIds',
          widget: 'relation',
          collection: 'event',
          search_fields: ['title'],
          value_field: '{{slug}}',
          display_fields: ['title'],
          multiple: true,
          required: false,
        }
      - &act-image { label: 'Image', name: 'image', widget: 'image', required: false }
      - &act-tags
        label: 'Tags'
        name: 'tags'
        widget: 'list'
        required: false
        field: { label: 'Tag', name: 'tag', widget: 'string' }

      # ── Physical activity ─────────────────────────────────────────────
      - &act-formation {
          label: 'Formation',
          name: 'formation',
          widget: 'string',
          required: false,
          hint: 'e.g. "Circle", "Line", "Mingling", "Longways set"',
        }
      - &act-activity-level {
          label: 'Activity Level',
          name: 'activityLevel',
          widget: 'select',
          options: ['inactive', 'somewhat-active', 'very-active'],
          required: false,
          hint: 'Physical exertion required — distinct from Energy Level above.',
        }
      - &act-contact-level {
          label: 'Physical Contact Level',
          name: 'physicalContactLevel',
          widget: 'select',
          options: ['none', 'some', 'high'],
          required: false,
        }
      - &act-contact-notes {
          label: 'Physical Contact Notes',
          name: 'physicalContactNotes',
          widget: 'string',
          required: false,
          hint: 'e.g. "Holding hands", "Hugging"',
        }
      - &act-accessibility {
          label: 'Accessibility Notes',
          name: 'accessibilityNotes',
          widget: 'markdown',
          required: false,
        }
      - &act-safety-flags
        label: 'Safety Flags'
        name: 'safetyFlags'
        widget: 'select'
        multiple: true
        required: false
        options:
          - { label: 'No running', value: 'no-running' }
          - { label: 'Spotter recommended for falls/landings', value: 'spotter-recommended' }
          - { label: 'Watch for tripping hazards', value: 'watch-for-tripping-hazards' }
      - &act-safety-other { label: 'Other Safety Notes', name: 'safetyNotesOther', widget: 'markdown', required: false }
      - &act-seated {
          label: 'Seated / Wheelchair Adaptable',
          name: 'seatedOrWheelchairAdaptable',
          widget: 'boolean',
          required: false,
          default: false,
        }
      - &act-beginner {
          label: 'Beginner Adaptable',
          name: 'beginnerAdaptable',
          widget: 'boolean',
          required: false,
          default: false,
          hint: 'Can this be simplified so total newcomers can participate?',
        }
      - &act-setting {
          label: 'Setting',
          name: 'setting',
          widget: 'select',
          options: ['indoor', 'outdoor', 'either'],
          required: false,
        }
      - &act-age-range {
          label: 'Age Range',
          name: 'ageRange',
          widget: 'string',
          required: false,
          hint: 'e.g. "8+", "All ages"',
        }
      - &act-posture {
          label: 'Posture',
          name: 'posture',
          widget: 'select',
          options: ['standing', 'sitting', 'either'],
          required: false,
        }
      - &act-materials {
          label: 'Materials Needed',
          name: 'materialsNeeded',
          widget: 'string',
          required: false,
          hint: 'e.g. "None", "One ball per group"',
        }

      # ── Game-specific ─────────────────────────────────────────────────
      - {
          label: 'Objective',
          name: 'objective',
          widget: 'string',
          required: false,
          hint: 'The win/end condition, e.g. "Be the last player standing"',
        }
      - &act-variations {
          label: 'Variations',
          name: 'variations',
          widget: 'markdown',
          required: false,
          hint: 'Alternate rule-sets groups commonly use.',
        }

      - &act-draft { label: 'Draft', name: 'draft', widget: 'boolean', required: false, default: false }

  - name: 'activity-dance'
    label: 'Dances'
    label_singular: 'Dance'
    folder: 'src/data/activities'
    create: true
    slug: '{{fields.title | slugify}}'
    filter: { field: 'type', value: 'dance' }
    fields:
      - *act-title
      - { label: 'Type', name: 'type', widget: 'hidden', default: 'dance' }
      - *act-excerpt
      - *act-instructions
      - *act-leading-tips
      - *act-adaptations
      - *act-group-size-min
      - *act-group-size-max
      - *act-group-size-notes
      - *act-duration
      - *act-energy-level
      - *act-origin
      - *act-references
      - *act-related-leaders
      - *act-related-events
      - *act-image
      - *act-tags
      - *act-formation
      - *act-activity-level
      - *act-contact-level
      - *act-contact-notes
      - *act-accessibility
      - *act-safety-flags
      - *act-safety-other
      - *act-seated
      - *act-beginner
      - *act-setting
      - *act-age-range
      - *act-posture
      - *act-materials
      # ── Dance-specific ────────────────────────────────────────────────
      - &act-difficulty {
          label: 'Difficulty',
          name: 'difficulty',
          widget: 'select',
          options: ['beginner', 'intermediate', 'advanced'],
          required: false,
        }
      - &act-meter { label: 'Meter', name: 'meter', widget: 'string', required: false, hint: 'e.g. "4/4", "3/4"' }
      - &act-is-called {
          label: 'Called Live',
          name: 'isCalled',
          widget: 'boolean',
          required: false,
          default: false,
          hint: 'Does a caller prompt each figure live, rather than dancers working from memory?',
        }
      - &act-formation-diagram {
          label: 'Formation Diagram',
          name: 'formationDiagram',
          widget: 'image',
          required: false,
          hint: 'Floor-plan/diagram image for non-obvious spatial layouts (contra sets, squares).',
        }
      - *act-draft

  - name: 'activity-song'
    label: 'Songs'
    label_singular: 'Song'
    folder: 'src/data/activities'
    create: true
    slug: '{{fields.title | slugify}}'
    filter: { field: 'type', value: 'song' }
    fields:
      - *act-title
      - { label: 'Type', name: 'type', widget: 'hidden', default: 'song' }
      - *act-excerpt
      - *act-instructions
      - *act-leading-tips
      - *act-adaptations
      - { label: 'Group Size', name: 'groupSize', widget: 'string', required: false, hint: 'e.g. "8-30", "Any size"' }
      - *act-duration
      - *act-energy-level
      - *act-origin
      - *act-references
      - *act-related-leaders
      - *act-related-events
      - *act-image
      - *act-tags
      # ── Song-specific ─────────────────────────────────────────────────
      - {
          label: 'Lyrics',
          name: 'lyrics',
          widget: 'markdown',
          required: false,
          hint: 'Only include for public-domain or traditional songs, or songs where rights are confirmed cleared. Otherwise leave blank and use References above.',
        }
      - { label: 'Sheet Music File', name: 'sheetMusicFile', widget: 'file', required: false }
      - { label: 'Key', name: 'key', widget: 'string', required: false, hint: 'e.g. "G major"' }
      - label: 'Tabs'
        name: 'tabs'
        widget: 'list'
        required: false
        hint: 'Chords/tab per instrument.'
        fields:
          - { label: 'Instrument', name: 'instrument', widget: 'string', hint: 'e.g. "Guitar", "Ukulele"' }
          - {
              label: 'Notation',
              name: 'notation',
              widget: 'text',
              required: false,
              hint: 'Chord-over-lyric text or ASCII tab.',
            }
          - {
              label: 'File',
              name: 'file',
              widget: 'file',
              required: false,
              hint: 'Scanned/handwritten tab, if you have one.',
            }
      - { label: 'Language', name: 'language', widget: 'string', required: false }
      - { label: 'Translation', name: 'translation', widget: 'markdown', required: false }
      - { label: 'Transliteration', name: 'transliteration', widget: 'markdown', required: false }
      - {
          label: 'Is a Round',
          name: 'isRound',
          widget: 'boolean',
          required: false,
          default: false,
          hint: 'Mark where voices enter directly in the Lyrics text (e.g. a bolded cue like "**→ Voice 2 enters here**").',
        }
      # Songs that involve motion (action songs) can still note exertion and adaptability.
      # No posture/seated-wheelchair field here — that pairing is specific to
      # activities with a posture element (games/dances/play-parties).
      - *act-activity-level
      - *act-age-range
      - *act-accessibility
      - *act-beginner
      - *act-draft

  # --- TESTIMONIALS (folder collection — one file per testimonial) ---
  - name: 'testimonial'
    label: 'Testimonials'
    label_singular: 'Testimonial'
    folder: 'src/data/testimonials'
    create: true
    slug: '{{fields.name | slugify}}'
    summary: '{{fields.quote}}'
    fields:
      - { label: 'Quote', name: 'quote', widget: 'markdown' }
      - { label: 'Name', name: 'name', widget: 'string', required: false }
      - { label: 'Role / Affiliation', name: 'role', widget: 'string', required: false }

  # --- GLOBAL SETTINGS (navigation, footer, social) ---
  - name: 'settings'
    label: 'Site Settings'
    files:
      - label: 'Global Site Settings'
        name: 'site'
        file: 'src/data/settings/site.json'
        fields:
          - { label: 'Organization Name', name: 'name', widget: 'string' }
          - { label: 'Mission Statement', name: 'mission', widget: 'text' }
          - { label: 'Event Page CTA Title', name: 'eventCtaTitle', widget: 'string' }
          - { label: 'Event Page CTA Subtitle', name: 'eventCtaSubtitle', widget: 'markdown' }
          - label: 'Social Links'
            name: 'socialLinks'
            widget: 'list'
            fields:
              - { label: 'Platform', name: 'platform', widget: 'string', hint: 'e.g. Facebook' }
              - { label: 'URL', name: 'url', widget: 'string', hint: 'Leave blank to hide the icon' }
              - { label: 'Icon (tabler)', name: 'icon', widget: 'string', hint: 'e.g. tabler:brand-facebook' }
          - label: 'Feature Flags'
            name: 'featureFlags'
            widget: 'object'
            fields:
              - { label: 'Show Activities Nav Link', name: 'activitiesNavLink', widget: 'boolean', default: false }
              - { label: 'Show About Page Map', name: 'aboutPageMap', widget: 'boolean', default: false }
              - {
                  label: 'Show People Without Photo or Bio',
                  name: 'peopleWithoutPhotoOrBio',
                  widget: 'boolean',
                  default: false,
                }

      - label: 'Navigation'
        name: 'navigation'
        file: 'src/data/settings/navigation.json'
        fields:
          - label: 'Header Links'
            name: 'links'
            widget: 'list'
            fields:
              - { label: 'Label', name: 'text', widget: 'string' }
              - { label: 'URL', name: 'href', widget: 'string' }
          - label: 'Header CTA Button'
            name: 'cta'
            widget: 'object'
            fields:
              - { label: 'Button Text', name: 'text', widget: 'string' }
              - { label: 'Button URL', name: 'href', widget: 'string' }

      - label: 'Footer'
        name: 'footer'
        file: 'src/data/settings/footer.json'
        fields:
          - { label: 'Footer Note / Copyright', name: 'footNote', widget: 'string' }
          - { label: 'Address', name: 'address', widget: 'string' }
          - label: 'Footer Link Columns'
            name: 'columns'
            widget: 'list'
            fields:
              - { label: 'Column Title', name: 'title', widget: 'string' }
              - label: 'Links'
                name: 'links'
                widget: 'list'
                fields:
                  - { label: 'Label', name: 'text', widget: 'string' }
                  - { label: 'URL', name: 'href', widget: 'string' }
